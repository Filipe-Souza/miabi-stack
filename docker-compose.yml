# n8n in queue mode, for Miabi: Stacks → Import Compose (stack name: n8n).
#
# Five apps: editor/webhooks (n8n), one worker, the worker's task-runner sidecar,
# Postgres and Redis. Versions pinned 2026-11-17: n8n 2.48.4 is the image behind
# n8nio/n8n:stable. n8n, n8n-worker and n8n-runners must always run the same version.
#
# Written for Miabi's importer: short-form ports/volumes only. depends_on, healthcheck,
# restart, env_file, secrets, deploy and labels are left out because the importer
# ignores them. Health checks, deploy strategy, limits and the route are set after
# import (README.md).
#
# Secrets are never written here. Each "${{ secrets.NAME }}" is a reference to the
# workspace vault. The importer doesn't expand ${...}, so the reference should reach the
# app as written, and Miabi resolves it at deploy time. Check this after import (README
# step 3). Create the three vault secrets first.
#
# Public hostname: not set here. It's the one Miabi generates when you turn on
# Network → External access for port 5678 on n8n (<app-handle>-<token>.<base-domain>,
# under MIABI_EXTERNAL_BASE_DOMAIN). Miabi has no variable that hands an app its own
# generated hostname, so it's pasted once into the stack's Shared environment as
# N8N_HOST, N8N_EDITOR_BASE_URL and N8N_WEBHOOK_URL (README step 5). Don't add those
# keys below: an app's own variable overrides the stack's shared one.
#
# Replace UTC (GENERIC_TIMEZONE and TZ, on n8n and n8n-worker) before importing.

services:
  n8n-postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: "${{ secrets.N8N_DB_PASSWORD }}"
    volumes:
      - pg-data:/var/lib/postgresql/data

  n8n-redis:
    image: redis:8.10.3-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # Main instance: editor UI, API, triggers and incoming webhooks. Executions go to the worker.
  n8n:
    image: n8nio/n8n:2.48.4
    ports:
      - "5678"
    environment:
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${{ secrets.N8N_DB_PASSWORD }}"
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: "6379"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: "${{ secrets.N8N_RUNNERS_AUTH_TOKEN }}"
      N8N_ENCRYPTION_KEY: "${{ secrets.N8N_ENCRYPTION_KEY }}"
    volumes:
      - n8n-data:/home/node/.n8n

  # Runs every execution, including manual ones. No volume, so it can roll on deploy.
  n8n-worker:
    image: n8nio/n8n:2.48.4
    command: worker
    environment:
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${{ secrets.N8N_DB_PASSWORD }}"
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: "${{ secrets.N8N_RUNNERS_AUTH_TOKEN }}"
      N8N_ENCRYPTION_KEY: "${{ secrets.N8N_ENCRYPTION_KEY }}"

  # Code-node sandbox for n8n-worker. It gets only the runner token: no DB password,
  # no encryption key.
  n8n-runners:
    image: n8nio/runners:2.48.4
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: "${{ secrets.N8N_RUNNERS_AUTH_TOKEN }}"

volumes:
  pg-data:
  redis-data:
  n8n-data:
