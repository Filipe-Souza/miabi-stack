# Generated by Miabi on the first sync and stored encrypted in the workspace vault. The values
# never appear in Git. Later syncs leave an existing secret alone, and prune never deletes a Secret.
#
# n8n-encryption-key encrypts every credential saved in n8n. Reveal it once from the vault
# (workspace Admin) and keep a copy outside Miabi. Never rotate it: rotating redeploys the
# apps with a new key, and every saved credential becomes unreadable.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: n8n-encryption-key
spec:
  generate: true
  length: 48
---
# Shared by the task broker in n8n/n8n-worker and the runner sidecar.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: n8n-runners-auth-token
spec:
  generate: true
  length: 48
