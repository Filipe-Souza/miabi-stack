# n8n in queue mode on Miabi, reconciled by GitOps from this repository.
#
#   stack.yaml      this file: the Stack the three n8n apps belong to
#   secrets.yaml    the encryption key and runner token, generated by Miabi
#   databases.yaml  managed PostgreSQL and Redis
#   apps.yaml       n8n (editor/webhooks), n8n-worker, n8n-runners, and n8n's volume
#
# Every .yaml/.yml file under the Git source's path is parsed as a miabi.io/v1 manifest,
# so keep other YAML (Compose files, CI configs) out of this directory.
apiVersion: miabi.io/v1
kind: Stack
metadata:
  name: n8n
spec:
  description: n8n in queue mode with an editor, a worker, a task-runner sandbox, managed Postgres and Redis
  # Public hostname. n8n is exposed on the URL Miabi generates for it (externalAccess in
  # apps.yaml), which isn't known until the first sync has created the app, and no
  # manifest variable can read it back. After the first sync, copy the hostname from
  # n8n → Network → External access, uncomment the block below, set it, and push. Every
  # member is then redeployed with the new values.
  #
  # env:
  #   N8N_HOST: n8n-xxxxxxxx.apps.example.com
  #   N8N_EDITOR_BASE_URL: https://n8n-xxxxxxxx.apps.example.com/
  #   N8N_WEBHOOK_URL: https://n8n-xxxxxxxx.apps.example.com/
