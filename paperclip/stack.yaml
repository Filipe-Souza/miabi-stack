# Paperclip on Miabi, reconciled by GitOps from this directory (Git source path: paperclip).
#
#   stack.yaml      this file: the Stack, and the public URL (filled in after the first sync)
#   secrets.yaml    the auth and tool-action signing secrets, generated by Miabi
#   databases.yaml  managed PostgreSQL 17
#   apps.yaml       the Paperclip server and its data volume
apiVersion: miabi.io/v1
kind: Stack
metadata:
  name: paperclip
spec:
  description: Paperclip, the control plane for AI agent companies, on managed PostgreSQL
  # Public URL. Paperclip runs in authenticated/public mode, which refuses to start without
  # one. So the first sync creates everything, but the app's deploy fails its health check
  # and nothing is served yet. Copy the generated hostname from
  # paperclip → Network → External access, uncomment the block, set it (https://, no
  # trailing slash), and push. The app then redeploys and comes up.
  #
  # env:
  #   PAPERCLIP_PUBLIC_URL: https://paperclip-xxxxxxxx.apps.example.com
