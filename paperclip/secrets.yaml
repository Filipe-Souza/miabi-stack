# Generated by Miabi on the first sync and stored encrypted in the workspace vault. Later syncs
# leave an existing secret alone, and prune never deletes a Secret.
#
# Signs login sessions. Rotating it signs everyone out.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: paperclip-better-auth-secret
spec:
  generate: true
  length: 64
---
# Signs approval-gated tool actions. Paperclip wants it independent of the auth secret.
# Rotate it only after pending approvals are resolved: they carry signatures made with the old value.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: paperclip-tool-action-signing-secret
spec:
  generate: true
  length: 64
